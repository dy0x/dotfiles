config-version = 2

after-startup-command = []
start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = [
  "AGENT",
  "ANKI",
  "BTC",
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7",
  "8",
  "9"
]

[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
alt-backspace = ["reload-config", "mode main"]
alt-q = "close --quit-if-last-window"

alt-f = "fullscreen"
alt-shift-f = "macos-native-fullscreen"
alt-t = "layout floating tiling"
alt-r = "layout v_tiles"
alt-shift-r = "layout h_tiles"
alt-ctrl-r = ["flatten-workspace-tree", "balance-sizes"]

alt-j = "focus --boundaries-action wrap-around-the-workspace dfs-next"
alt-k = "focus --boundaries-action wrap-around-the-workspace dfs-prev"
alt-shift-j = "swap --wrap-around dfs-next"
alt-shift-k = "swap --wrap-around dfs-prev"

# alt-j = "focus up"
# alt-k = "focus down"
# alt-h = "focus left"
# alt-l = "focus right"

# alt-shift-h = "move left"
# alt-shift-j = "move down"
# alt-shift-k = "move up"
# alt-shift-l = "move right"

alt-ctrl-h = "join-with left"
alt-ctrl-j = "join-with down"
alt-ctrl-k = "join-with up"
alt-ctrl-l = "join-with right"

alt-l = "resize smart -50"
alt-h = "resize smart +50"

alt-cmd-h = "move left"
alt-cmd-j = "move down"
alt-cmd-k = "move up"
alt-cmd-l = "move right"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-backtick = "workspace AGENT"

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"
alt-shift-backtick = "move-node-to-workspace AGENT"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = "workspace-back-and-forth"
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"

# App homes

# 1 = Terminal
alt-enter = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair 1 com.mitchellh.ghostty app:Ghostty"'

# 2 = Main browser
# alt-w = 'exec-and-forget /bin/bash -lc "aerospace workspace 2 && open -na \"Brave Browser.app\" --args --profile-directory=\"Profile 1\""'
alt-w = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh 2 com.brave.Browser \"profile:Profile 1\""'

# 3 = Files
alt-e = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh 3 com.apple.finder app:Finder"'

# 4 = AI chat

# 5 = Mail / Messages
alt-m = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair 5 com.apple.mail app:Mail"'
alt-shift-m = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair 5 com.apple.MobileSMS app:Messages"'

# 6 = Chinese Immersion
# alt-shift-w = 'exec-and-forget /bin/bash -lc "aerospace workspace 6 && open -na \"Brave Browser.app\" --args --profile-directory=\"Default\""'
alt-shift-w = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh 6 com.brave.Browser \"profile:Default\""'

# 7 = Learning / reading
alt-a = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair ANKI net.ankiweb.launcher app:Anki"'
alt-n = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair 7 com.ranchero.NetNewsWire-Evergreen app:NetNewsWire"'

# 8 = Finance
alt-s = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh BTC com.sparrowwallet.sparrow"'

# AGENT
alt-g = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair AGENT com.openai.codex"'
alt-c = 'exec-and-forget /bin/bash -lc "$HOME/.config/aerospace/aerospace-home.sh --repair 4 com.anthropic.claudefordesktop app:Claude"'

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = [
  "move-node-to-workspace 3",
  "layout tiling",
]

[[on-window-detected]]
if.app-id = "com.anthropic.claudefordesktop"
run = "move-node-to-workspace 4"

[[on-window-detected]]
if.app-id = "com.apple.mail"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-id = "com.apple.MobileSMS"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-id = "net.ankiweb.launcher"
run = "move-node-to-workspace ANKI"

[[on-window-detected]]
if.app-id = "com.ranchero.NetNewsWire-Evergreen"
run = "move-node-to-workspace 7"

[[on-window-detected]]
if.app-id = "com.sparrowwallet.sparrow"
run = "move-node-to-workspace BTC"

[[on-window-detected]]
if.app-id = "com.openai.codex"
run = "move-node-to-workspace AGENT"
